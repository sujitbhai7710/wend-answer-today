name: Daily Wend Puzzle Update

# Runs daily at 1:30 PM IST (08:00 UTC) to scrape, build, and deploy.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC = 1:30 PM IST

env:
  WORKER_URL: ${{ secrets.WORKER_URL }}
  WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Clear all caches to prevent stale data
      - name: Clear all caches and temp files
        run: |
          echo "Clearing npm cache..."
          npm cache clean --force 2>/dev/null || true
          echo "Clearing any previous dist/build output..."
          rm -rf dist/ .cache/
          echo "Caches cleared."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Verify system Chrome is available (no download needed!)
      - name: Verify system Google Chrome
        run: |
          echo "Chrome path: $(which google-chrome-stable)"
          echo "Chrome version: $(google-chrome-stable --version)"
          echo "CHROME_PATH=/usr/bin/google-chrome-stable" >> "$GITHUB_ENV"

      - name: Install root dependencies
        run: npm ci

      - name: Install scraper dependencies (puppeteer-core only, ~8MB)
        run: |
          cd scraper
          npm install --no-package-lock

      - name: Scrape latest Wend puzzle (LinkedIn + fallback)
        run: node scrape-wend.js
        working-directory: scraper
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
          CHROME_PATH: /usr/bin/google-chrome-stable

      - name: Build site
        run: npm run build
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=wend-answer-today
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Notify Google and submit sitemap
        if: success()
        continue-on-error: true
        run: npm run notify-google
        env:
          SITE_URL: https://wendanswertoday.me
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}

      - name: Notify Bing IndexNow for all pages
        if: success()
        continue-on-error: true
        run: npm run notify-indexnow
        env:
          SITE_URL: https://wendanswertoday.me
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
